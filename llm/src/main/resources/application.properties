spring.application.name=llm
server.port=8090

google.storage.bucket=book-covers-bucket

# Resource server configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks

# CORS configuration
cors.frontend-url-host=http://localhost:4200

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5440/llm-db
spring.datasource.username=pguser
spring.datasource.password=1234

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.session.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Vectorstore configuration
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.id-type=TEXT

# GCP Embeddings configuration
spring.ai.vertex.ai.embedding.project-id=${VERTEX_PROJECT_ID}
spring.ai.vertex.ai.embedding.location=us-central1
spring.ai.vertex.ai.embedding.text.options.model=text-embedding-004

# GCP Gemini Chat configuration
spring.ai.vertex.ai.gemini.project-id=${VERTEX_PROJECT_ID}
spring.ai.vertex.ai.gemini.location=us-central1
