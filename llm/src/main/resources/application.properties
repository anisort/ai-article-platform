spring.application.name=llm
server.port=${SERVER_PORT:8090}

google.storage.bucket=${GOOGLE_STORAGE_BUCKET:book-covers-bucket}

# Resource server configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

# CORS configuration
cors.frontend-url-host=${CORS_FRONTEND_URL_HOST:http://localhost:4200}

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/llm-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.session.jdbc.initialize-schema=${SPRING_SESSION_JDBC_INITIALIZE_SCHEMA:always}
spring.ai.chat.memory.repository.jdbc.initialize-schema=${SPRING_AI_CHAT_MEMORY_REPOSITORY_JDBC_INITIALIZE_SCHEMA:always}

# Vectorstore configuration
spring.ai.vectorstore.pgvector.index-type=${SPRING_AI_VECTORSTORE_PGVECTOR_INDEX_TYPE:hnsw}
spring.ai.vectorstore.pgvector.distance-type=${SPRING_AI_VECTORSTORE_PGVECTOR_DISTANCE_TYPE:cosine_distance}
spring.ai.vectorstore.pgvector.initialize-schema=${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:true}
spring.ai.vectorstore.pgvector.id-type=TEXT

# GCP Embeddings configuration
spring.ai.vertex.ai.embedding.project-id=${SPRING_AI_VERTEX_AI_EMBEDDING_PROJECT_ID:${VERTEX_PROJECT_ID:}}
spring.ai.vertex.ai.embedding.location=${SPRING_AI_VERTEX_AI_EMBEDDING_LOCATION:us-central1}
spring.ai.vertex.ai.embedding.text.options.model=${SPRING_AI_VERTEX_AI_EMBEDDING_TEXT_OPTIONS_MODEL:text-embedding-004}

# GCP Gemini Chat configuration
spring.ai.vertex.ai.gemini.project-id=${SPRING_AI_VERTEX_AI_GEMINI_PROJECT_ID:${VERTEX_PROJECT_ID:}}
spring.ai.vertex.ai.gemini.location=${SPRING_AI_VERTEX_AI_GEMINI_LOCATION:us-central1}
