<section class="register-page">
  <div class="register-shell">
    <div class="register-copy">
      <p class="eyebrow">Join Commit</p>
      <h1>Create your author profile</h1>
      <p class="lead">
        Publish articles, build your portfolio, and keep everything in one place.
      </p>
    </div>

    <div class="register-card">
      @if (loading()) {
        <div class="loading-state">Creating account...</div>
      } @else {
        <form class="register-form" [formGroup]="registerForm">
          <h2>Sign up</h2>

          @if (message()) {
            <div class="status-message">
              {{ message() }}
            </div>
          }

          <div class="field-grid">
            <label class="field">
              <span>Username</span>
              <input type="text" id="username" formControlName="username" placeholder="Choose a username" />
            </label>

            <label class="field">
              <span>Email</span>
              <input type="text" id="email" formControlName="email" placeholder="you@example.com" />
            </label>

            <label class="field">
              <span>Name</span>
              <input type="text" id="name" formControlName="name" placeholder="Your public name" />
            </label>

            <label class="field">
              <span>Password</span>
              <input type="password" id="password" formControlName="password" placeholder="At least 8 characters" />
            </label>

            <label class="field field--full">
              <span>Repeat password</span>
              <input type="password" id="repeatPassword" formControlName="repeatPassword" placeholder="Repeat your password" />
            </label>
          </div>

          <button class="submit-button" type="submit" (click)="onRegister()" [disabled]="registerForm.invalid">
            Sign up
          </button>

          <div class="login-row">
            <span>Already have an account?</span>
            <button class="login-link" type="button" (click)="onLogin()">Sign in</button>
          </div>
        </form>
      }
    </div>
  </div>
</section>
