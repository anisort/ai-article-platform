<div class="register-container">
  @if(loading()){
    Loading...
  } @else {

        <input type="text" id="username" formControlName="username" />

<!--          <small class="error">Username is required.</small>-->
<!--        }-->

<!--          <small class="error">Username cannot be less than 3 characters.</small>-->
<!--        }-->

<!--          <small class="error">Username is already taken.</small>-->
<!--        }-->
      </div>
      <div class="field">
        <label for="email">Email:</label>
        <input type="text" id="email" formControlName="email" />

<!--          <small class="error">Email is already taken.</small>-->
<!--        }-->

      <div class="field">
        <label for="name">Name:</label>

<!--          <small class="error">Name must be at least 3 characters.</small>-->
<!--        }-->

        <input type="password" id="repeatPassword" formControlName="repeatPassword" />
