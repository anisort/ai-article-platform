<button class="advisor-fab" type="button" (click)="toggle()" [attr.aria-label]="isOpen() ? 'Close advisor' : 'Open advisor'" [attr.title]="isOpen() ? 'Close advisor' : 'Open advisor'">
  <i class="bi bi-robot" aria-hidden="true"></i>
</button>

@if (isOpen()) {
  <section class="advisor-panel">
    <header class="advisor-header">
      <strong>Advisor</strong>
      <button class="advisor-clear" type="button" (click)="clearSession()">Clear</button>
    </header>

    <div class="advisor-messages">
      @for (message of messages(); track $index) {
        <div class="message" [class.message--user]="message.role === 'user'">
          <div [innerHTML]="renderMarkdown(message.text)"></div>
        </div>
      }
      @if (isLoading()) {
        <app-loading-state label="Loading" title="Thinking..." [compact]="true"></app-loading-state>
      }
    </div>

    <div class="advisor-input">
      <input
        type="text"
        [(ngModel)]="input"
        placeholder="Ask about articles"
        (keydown.enter)="send()"
      />
      <button class="advisor-send" type="button" (click)="send()" [disabled]="isLoading()" aria-label="Send message" title="Send message">
        <i class="bi bi-send-fill" aria-hidden="true"></i>
      </button>
    </div>
  </section>
}
