<section class="article-list-page">
  <app-page-intro
    kicker="Articles"
    title="All Articles"
    description="Browse all published articles and switch between semantic and title-focused search."
  ></app-page-intro>

  <div class="search-mode-controls">
    <app-segmented-control
      [options]="modeOptions"
      [active]="searchMode()"
      ariaLabel="Search type"
      (changed)="onModeChange($event)"
    />
  </div>

  @if (articles().length) {
    <div class="article-grid">
      @for (article of articles(); track article.id) {
        <app-article-preview-card [article]="article"></app-article-preview-card>
      }
    </div>
  } @else {
    <div class="empty-state">No published articles yet.</div>
  }
</section>
