<section class="article-list-page">
  <app-page-intro
    kicker="Articles"
    title="All Articles"
    description="Browse all published articles and switch between semantic and title-focused search."
  ></app-page-intro>

  <div class="search-mode-controls" role="radiogroup" aria-label="Search type">
    <label class="mode-option" [class.mode-option--active]="searchMode() === 'semantic'">
      <input
        type="radio"
        name="searchMode"
        [checked]="searchMode() === 'semantic'"
        (change)="onModeChange('semantic')"
      />
      <span>Semantic</span>
    </label>
    <label class="mode-option" [class.mode-option--active]="searchMode() === 'title'">
      <input
        type="radio"
        name="searchMode"
        [checked]="searchMode() === 'title'"
        (change)="onModeChange('title')"
      />
      <span>Title</span>
    </label>
  </div>

  @if (articles().length) {
    <div class="article-grid">
      @for (article of articles(); track article.id) {
        <app-article-preview-card [article]="article"></app-article-preview-card>
      }
    </div>
  } @else {
    <div class="empty-state">No published articles yet.</div>
  }
</section>
