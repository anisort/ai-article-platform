<section class="article-detail-page">
  @if (loading()) {
    <app-loading-state label="Loading article" title="Preparing the page..."></app-loading-state>
  } @else if (articleData()) {
    <article class="article-shell">
      <app-page-intro
        kicker="Article details"
        [title]="articleData()?.title || 'Article'"
      ></app-page-intro>

      <header class="article-hero">
        <div class="article-hero-top">
          <p class="article-meta-date">{{ articleData()?.createdAt | date:'mediumDate' }}</p>
        </div>

        <div class="article-hero-main">
          <div class="article-hero-info">
            <div class="article-author-row">
              <div class="article-author">
                <a class="article-author-link" [routerLink]="['/profile', authorProfile().id]" aria-label="Open author profile">
                  <app-profile-summary-card [profile]="authorProfile()" [showStats]="false" />
                </a>
              </div>

              <div class="article-actions">
                @if (canLike()) {
                  <button
                    type="button"
                    class="article-like-button"
                    [class.article-like-button--active]="liked()"
                    [attr.aria-label]="liked() ? 'Unlike article' : 'Like article'"
                    [attr.title]="liked() ? 'Unlike article' : 'Like article'"
                    [disabled]="likeLoading()"
                    (click)="toggleLike()">
                    <i class="bi" [class.bi-heart-fill]="liked()" [class.bi-heart]="!liked()" aria-hidden="true"></i>
                    <span>{{ liked() ? 'Unlike article' : 'Like article' }} ({{ likesCountLabel() }})</span>
                  </button>
                } @else {
                  <span class="article-like-count" aria-label="Likes count">
                    <i class="bi bi-heart" aria-hidden="true"></i>
                    {{ likesCountLabel() }}
                  </span>
                }

                @if (isAuthor()) {
                  <div class="article-owner-actions">
                    <a class="article-owner-button" [routerLink]="['/edit-article', articleData()?.id]">Edit</a>
                    <button
                      type="button"
                      class="article-owner-button article-owner-button--danger"
                      [disabled]="deleteLoading()"
                      (click)="deleteArticle()">
                      Delete
                    </button>
                  </div>
                }
              </div>
            </div>

            @if (articleData()?.summary) {
              <p class="article-summary">{{ articleData()?.summary }}</p>
            }
          </div>
        </div>
      </header>

      @if (articleData()?.imageUrl) {
        <div class="article-cover article-cover--banner">
          <img [src]="articleData()?.imageUrl" [alt]="articleData()?.title || 'Article image'">
        </div>
      }

      <section class="article-content">
        <div class="article-block article-block--text" (click)="onArticleContentClick($event)" [innerHTML]="contentMarkdown()">
        </div>
      </section>
    </article>
  }
</section>
