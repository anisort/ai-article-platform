<div class="assistant-panel__header">
  <strong>Article Assistant</strong>
  <div class="assistant-panel__header-actions">
    <button type="button" class="assistant-button assistant-button--send" (click)="createChat()">New chat</button>
    <button type="button" class="assistant-button assistant-button--close" (click)="closePanel.emit()">Close</button>
  </div>
</div>

<div class="assistant-selectors">
  <app-select-field
    label="Chat"
    [value]="selectedChatId() ?? ''"
    [options]="chatOptions()"
    [disabled]="!chats().length"
    (valueChange)="onChatSelect($event)"
  />
  <app-select-field
    label="Mode"
    [value]="mode()"
    [options]="modeOptions"
    [disabled]="!selectedChatId()"
    (valueChange)="onModeSelect($event)"
  />
</div>

@if (selectedChatId()) {
  <div class="assistant-messages" (click)="messagesClick.emit($event)">
    @for (message of messages(); track message.id) {
      <app-message-bubble
        [html]="rendered()(message.content)"
        [isUser]="message.role === 'USER'"
        [showInsert]="message.role === 'ASSISTANT'"
        (insert)="insertMessage.emit(message.content)"
      />
    }
    @if (loading()) { <app-loading-state label="Loading" title="Thinking..." [compact]="true"></app-loading-state> }
  </div>
  <div class="assistant-input">
    <textarea [value]="inputText()" rows="3" placeholder="Ask assistant..." (input)="onInputChange($event)" (keydown)="onInputKeydown($event)"></textarea>
    <button type="button" class="assistant-button assistant-button--send" (click)="sendMessage()" [disabled]="loading()">Send</button>
  </div>
} @else {
  <div class="assistant-empty">Create or pick a chat.</div>
}
