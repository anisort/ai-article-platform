<app-editor-block-frame
  [blockId]="block().id"
  [compact]="true"
  [isDragging]="isDragging()"
  [isDragOver]="isDragOver()"
  (moveUp)="moveUp.emit()"
  (moveDown)="moveDown.emit()"
  (remove)="remove.emit()"
  (dragStarted)="dragStarted.emit($event)"
  (dragEntered)="dragEntered.emit($event)"
  (dropped)="dropped.emit($event)"
  (dragEnded)="dragEnded.emit()">
  <div class="image-block">
    <label class="upload-dropzone">
      <input
        type="file"
        accept="image/*"
        (change)="onFileSelected($event)" />

      @if (block().imageUrl) {
        <div class="preview">
          <img [src]="block().imageUrl" alt="preview" />
        </div>
      } @else {
        <div class="upload-placeholder">
          <div class="upload-icon">+</div>
          <div class="upload-text">{{ uploading() ? 'Uploading...' : 'Upload image' }}</div>
        </div>
      }
    </label>

    <div class="row">
      <input
        type="text"
        placeholder="Caption"
        [ngModel]="block().caption"
        (ngModelChange)="setCaption($event)" />
    </div>
  </div>
</app-editor-block-frame>
