<app-editor-block-frame
  [blockId]="block().id"
  [isDragging]="isDragging()"
  [isDragOver]="isDragOver()"
  (moveUp)="moveUp.emit()"
  (moveDown)="moveDown.emit()"
  (remove)="remove.emit()"
  (dragStarted)="dragStarted.emit($event)"
  (dragEntered)="dragEntered.emit($event)"
  (dropped)="dropped.emit($event)"
  (dragEnded)="dragEnded.emit()">
  <div class="text-block">
    <div class="toolbar">
      <label class="heading-control">
        <select [ngModel]="headingLevel()" (ngModelChange)="setHeadingLevel($event)">
          <option value="1">h1</option>
          <option value="2">h2</option>
          <option value="3">h3</option>
          <option value="4">h4</option>
          <option value="5">h5</option>
          <option value="6">h6</option>
        </select>
        <button type="button" class="tool-button" (click)="heading()">Apply</button>
      </label>

      <div class="tool-group">
        <button type="button" class="tool-button tool-button--strong" (click)="bold()">B</button>
        <button type="button" class="tool-button tool-button--italic" (click)="italic()">i</button>
      </div>

      <div class="tool-group">
        <button type="button" class="tool-button" (click)="quote()">"</button>
        <button type="button" class="tool-button" (click)="link()">Link</button>
      </div>

      <div class="tool-group">
        <button type="button" class="tool-button" (click)="bulletedList()">List</button>
        <button type="button" class="tool-button" (click)="numberedList()">1.</button>
      </div>
    </div>

    <textarea
      #text
      rows="8"
      [ngModel]="block().content"
      (ngModelChange)="onInput($event)"
      placeholder="Write in markdown">
    </textarea>
  </div>
</app-editor-block-frame>
