<div class="profile-meta">
  <div class="profile-meta__main">
    <app-avatar
      [imageUrl]="profile().avatar"
      [name]="displayName()"
      size="4.25rem" />

    <div class="profile-identify">
      <div class="profile-identify__title">
        <strong>{{ displayName() }}</strong>
        @if (settingsLink(); as link) {
          <a class="profile-settings-link" [routerLink]="link" title="Edit profile" aria-label="Edit profile">
            <i class="bi bi-gear-fill"></i>
          </a>
        }
      </div>
      @if (profileHandle(); as handle) {
        <span>{{ handle }}</span>
      }
      @if (profile().email) {
        <span>{{ profile().email }}</span>
      }

      @if (canFollow()) {
        <button
          type="button"
          class="profile-follow-button profile-follow-button--inline"
          [disabled]="followLoading()"
          (click)="followToggle.emit()">
          {{ profile().following ? 'Unfollow' : 'Follow' }}
        </button>
      }
    </div>

    @if (showStats()) {
      <div class="profile-stats">
        <button
          type="button"
          class="profile-stat"
          [class.profile-stat--active]="connectionTab() === 'following'"
          (click)="connectionSelect.emit('following')">
          <strong>{{ followingCount() }}</strong>
          <span>Following</span>
        </button>
        <button
          type="button"
          class="profile-stat"
          [class.profile-stat--active]="connectionTab() === 'followers'"
          (click)="connectionSelect.emit('followers')">
          <strong>{{ followersCount() }}</strong>
          <span>Followers</span>
        </button>
      </div>
    }

  </div>
</div>
