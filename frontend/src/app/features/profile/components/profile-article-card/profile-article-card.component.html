<article class="profile-card">
  <div class="profile-card__media">
    @if (article().imageUrl) {
      <img [src]="article().imageUrl || ''" [alt]="article().title">
    } @else {
      <div class="profile-card__fallback">{{ article().title }}</div>
    }
  </div>

  <div class="profile-card__body">
    <p class="profile-card__date">{{ article().dateLabel }}</p>
    <h2>{{ article().title }}</h2>
    @if (article().summary) {
      <p>{{ article().summary }}</p>
    }
    <div class="profile-card__actions">
      <a [routerLink]="article().articleLink">Open</a>
      @if (article().editLink) {
        <a [routerLink]="article().editLink!">Edit</a>
      }
    </div>
  </div>
</article>
