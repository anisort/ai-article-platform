<a class="profile-user-card" [routerLink]="['/profile', user().id]">
  <app-avatar
    class="profile-user-card__avatar"
    [imageUrl]="user().avatar"
    [name]="displayName()"
    size="4.25rem" />

  <div class="profile-user-card__meta">
    <strong>{{ displayName() }}</strong>
    @if (email(); as emailValue) {
      <span>{{ emailValue }}</span>
    }
    @if (profileHandle(); as handle) {
      <span>{{ handle }}</span>
    }
  </div>
</a>
