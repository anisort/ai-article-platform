<ion-app>
  <ion-menu contentId="main-content" side="start" menuId="main-menu" class="side-menu">
    <ion-header class="menu-header">
      <ion-toolbar class="menu-toolbar">
        <div class="menu-brand">
          <p class="menu-eyebrow">Navigation</p>
          <ion-title>Commit</ion-title>
          <p class="menu-subtitle">Move through the platform</p>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content class="menu-content">
      <ion-list class="menu-list">
        <ion-item class="menu-item" routerLink="/home" routerDirection="root">Home</ion-item>
        <ion-item class="menu-item" routerLink="/articles" routerDirection="root">Articles</ion-item>
        <ion-item class="menu-item" routerLink="/profile" routerDirection="root">Profile</ion-item>
      </ion-list>

      <div class="menu-theme-card">
        <div class="menu-theme-copy">
          <p class="menu-theme-label">Theme</p>
          <p class="menu-theme-value">{{ isDarkTheme ? 'Dark mode' : 'Light mode' }}</p>
        </div>
        <button
          type="button"
          class="theme-switch"
          [class.theme-switch--active]="isDarkTheme"
          (click)="toggleTheme()"
          [attr.aria-pressed]="isDarkTheme"
          [attr.aria-label]="isDarkTheme ? 'Switch to light theme' : 'Switch to dark theme'">
          <span class="theme-switch__track">
            <span class="theme-switch__thumb"></span>
          </span>
        </button>
      </div>
    </ion-content>
  </ion-menu>

  <div class="app-shell" id="main-content">
    <app-header></app-header>
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
    <app-advisor-widget></app-advisor-widget>
  </div>
</ion-app>
