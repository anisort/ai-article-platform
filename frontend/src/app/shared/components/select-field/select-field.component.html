<label class="select-field" (click)="onRootClick($event)">
  @if (label()) {
    <span class="select-field__label">{{ label() }}</span>
  }
  <div class="select-field__dropdown">
    <button
      type="button"
      class="select-field__trigger"
      [disabled]="disabled()"
      (click)="toggleOpen()">
      <span>{{ selectedLabel() }}</span>
      <span class="select-field__chevron" aria-hidden="true"></span>
    </button>

    @if (open()) {
      <div class="select-field__menu">
        @for (option of options(); track option.value) {
          <button
            type="button"
            class="select-field__option"
            [disabled]="option.disabled === true"
            (click)="choose(option)">
            {{ option.label }}
          </button>
        }
      </div>
    }
  </div>
</label>
