<header class="header-container">
  <div class="header-wrapper">
    <div class="left">
      <div class="brand-chip">
        <ion-menu-button class="menu-button" menu="main-menu"></ion-menu-button>
        <span class="brand-divider" aria-hidden="true"></span>
        <div class="brand-copy">
          <span class="brand-mark">Commit</span>
          <span class="brand-sub">AI article platform</span>
        </div>
      </div>
    </div>

    <div class="center">
      <div class="search-shell" aria-label="Search articles">
        <input
          #searchInput
          type="text"
          class="form-control"
          placeholder="Search request"
          [value]="searchQuery"
          (keydown.enter)="onSearchSubmit(searchInput.value)"
        >
        <button type="button" class="search-icon" (click)="onSearchSubmit(searchInput.value)" aria-label="Search">
          <ion-icon name="search-outline"></ion-icon>
        </button>
      </div>
    </div>

    <div class="right">
      @if (!authService.isAuthenticated()) {
        <div class="auth-buttons">
          <button class="login" (click)="onLogin()">Sign in</button>
          <button class="register" (click)="onRegister()">Sign up</button>
        </div>
      } @else {
        <div class="auth-buttons">
          <button class="login" (click)="onProfile()">Profile</button>
          <button class="logout" (click)="onLogout()">Logout</button>
        </div>
      }
    </div>
  </div>
</header>
