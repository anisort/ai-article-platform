<section
  class="block-frame"
  [class.block-frame--compact]="compact()"
  [class.block-frame--dragging]="isDragging()"
  [class.block-frame--drag-over]="isDragOver()"
  (dragenter)="onDragEnter($event)"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)">
  <aside class="block-rail">
    <button
      type="button"
      class="rail-button rail-button--ghost rail-button--drag"
      aria-label="Drag block"
      draggable="true"
      (dragstart)="onDragStart($event)"
      (dragend)="dragEnded.emit()">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <button type="button" class="rail-button" (click)="moveUp.emit()" aria-label="Move block up">
      <ion-icon name="chevron-up-outline"></ion-icon>
    </button>

    <button type="button" class="rail-button" (click)="moveDown.emit()" aria-label="Move block down">
      <ion-icon name="chevron-down-outline"></ion-icon>
    </button>

    <button type="button" class="rail-button" (click)="remove.emit()" aria-label="Remove block">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </aside>

  <div class="block-content">
    <ng-content></ng-content>
  </div>
</section>
