<div class="segmented-control" role="tablist" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="tab"
      class="segment-option"
      [class.segment-option--active]="active() === option.value"
      [attr.aria-selected]="active() === option.value"
      (click)="changed.emit(option.value)">
      <span>{{ option.label }}</span>
      @if (option.count !== null && option.count !== undefined) {
        <span class="segment-count">{{ option.count }}</span>
      }
    </button>
  }
</div>
