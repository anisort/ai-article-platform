<section class="loading-state" [class.loading-state--compact]="compact()">
  <div class="loading-state__spinner" aria-hidden="true"></div>
  <div class="loading-state__content">
    <p class="loading-state__label">{{ label() }}</p>
    <h2 class="loading-state__title">{{ title() }}</h2>
  </div>
</section>
