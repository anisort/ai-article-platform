spring.application.name=auth
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/auth-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OAuth 2.0 configuration
auth.client.id=${AUTH_CLIENT_ID:auth-client-articles}
auth.client.secret=${AUTH_CLIENT_SECRET:secret}
auth.client.redirect-uri=${AUTH_CLIENT_REDIRECT_URI:http://localhost:4200/home}
auth.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8080}
auth.token.access-token-ttl-minutes=120
auth.token.refresh-token-ttl-days=30

# OAuth 2.0 Google configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:81/auth/login/oauth2/code/google

# OAuth 2.0 GitHub configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# CORS configuration
cors.frontend-url-host=${CORS_FRONTEND_URL_HOST:http://localhost:4200}
files.api-url=${FILES_API_URL:http://localhost:9090/api/v1/files}

logging.level.org.springframework.security=TRACE
