spring.application.name=auth

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5439/auth-db
spring.datasource.username=pguser
spring.datasource.password=1234

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OAuth 2.0 configuration
auth.client.id=auth-client-articles
auth.client.secret=secret
auth.client.redirect-uri=http://localhost:4200/articles
auth.issuer-uri=http://localhost:8080

# OAuth 2.0 Google configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# OAuth 2.0 GitHub configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# CORS configuration
cors.frontend-url-host=http://localhost:4200

logging.level.org.springframework.security=TRACE

app.seed.token=${SEED_TOKEN:seed-local-token}
app.seed.on-startup=${SEED_ON_STARTUP:false}
app.seed.users-file=${SEED_USERS_FILE:seed/data/users.seed.json}
