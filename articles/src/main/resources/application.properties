spring.application.name=articles
server.port=7070

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5438/articles-db
spring.datasource.username=pguser
spring.datasource.password=1234

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS configuration
cors.frontend-url-host=http://localhost:4200

# Resource server configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks

services.user.url=http://localhost:8080
services.llm.url=http://localhost:8090
services.files.url=http://localhost:9090

app.seed.token=${SEED_TOKEN:seed-local-token}
app.seed.on-startup=${SEED_ON_STARTUP:false}
app.seed.articles-file=${SEED_ARTICLES_FILE:seed/data/articles.seed.json}
app.seed.skip-llm-description=${SEED_SKIP_LLM_DESCRIPTION:true}
app.seed.skip-vector-sync=${SEED_SKIP_VECTOR_SYNC:true}
app.seed.vector.batch-size=${SEED_VECTOR_BATCH_SIZE:30}
app.seed.vector.retry-count=${SEED_VECTOR_RETRY_COUNT:4}
app.seed.vector.retry-delay-ms=${SEED_VECTOR_RETRY_DELAY_MS:600}
app.seed.vector.throttle-ms=${SEED_VECTOR_THROTTLE_MS:120}
app.seed.vector.max-retry-delay-ms=${SEED_VECTOR_MAX_RETRY_DELAY_MS:20000}
app.seed.vector.retry-until-success=${SEED_VECTOR_RETRY_UNTIL_SUCCESS:true}
