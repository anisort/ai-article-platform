spring.application.name=articles
server.port=${SERVER_PORT:7070}

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/articles-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS configuration
cors.frontend-url-host=${CORS_FRONTEND_URL_HOST:http://localhost:4200}

# Resource server configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

services.user.url=${SERVICES_USER_URL:http://localhost:8080}
services.llm.url=${SERVICES_LLM_URL:http://localhost:8090}
services.files.url=${SERVICES_FILES_URL:http://localhost:9090}

# Redis and cache configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:1234}
spring.cache.type=${SPRING_CACHE_TYPE:redis}
