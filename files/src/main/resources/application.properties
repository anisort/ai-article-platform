spring.application.name=files
server.port=${SERVER_PORT:9090}

google.storage.bucket=${GOOGLE_STORAGE_BUCKET:book-covers-bucket}

# Resource server configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

# CORS configuration
cors.frontend-url-host=${CORS_FRONTEND_URL_HOST:http://localhost:4200}
