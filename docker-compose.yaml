services:
  auth:
    build:
      context: .
      dockerfile: dockerfiles/auth.Dockerfile
    container_name: auth-app
    depends_on:
      - pg-auth
      - files
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=${DATASOURCE_AUTH_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - AUTH_CLIENT_REDIRECT_URI=${AUTH_CLIENT_REDIRECT_URI}
      - AUTH_ISSUER_URI=${AUTH_ISSUER_URI}
      - CORS_FRONTEND_URL_HOST=${FRONTEND_URL_HOST}
      - FILES_API_URL=${FILES_API_URL_INTERNAL}
      - GOOGLE_CLIENT_ID=${GOOGLE_OAUTH2_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_OAUTH2_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_OAUTH2_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_OAUTH2_CLIENT_SECRET}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/credentials.json
    volumes:
      - ./secret/credentials.json:/secrets/credentials.json:ro
    ports:
      - "8080:8080"
    networks:
      - lib-network

  articles:
    build:
      context: .
      dockerfile: dockerfiles/articles.Dockerfile
    container_name: articles-app
    depends_on:
      - pg-articles
      - redis
      - auth
      - llm
      - files
    environment:
      - SERVER_PORT=7070
      - SPRING_DATASOURCE_URL=${DATASOURCE_ARTICLES_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${RESOURCE_SERVER_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=${RESOURCE_SERVER_JWK_SET_URI}
      - CORS_FRONTEND_URL_HOST=${FRONTEND_URL_HOST}
      - SERVICES_USER_URL=${AUTH_SERVICE_URL_INTERNAL}
      - SERVICES_LLM_URL=${LLM_SERVICE_URL_INTERNAL}
      - SERVICES_FILES_URL=${FILES_SERVICE_URL_INTERNAL}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_CACHE_TYPE=${CACHE_TYPE}
    ports:
      - "7070:7070"
    networks:
      - lib-network

  files:
    build:
      context: .
      dockerfile: dockerfiles/files.Dockerfile
    container_name: files-app
    environment:
      - SERVER_PORT=9090
      - GOOGLE_STORAGE_BUCKET=${GCP_STORAGE_BUCKET_NAME}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${RESOURCE_SERVER_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=${RESOURCE_SERVER_JWK_SET_URI}
      - CORS_FRONTEND_URL_HOST=${FRONTEND_URL_HOST}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/credentials.json
    volumes:
      - ./secret/credentials.json:/secrets/credentials.json:ro
    ports:
      - "9090:9090"
    networks:
      - lib-network

  llm:
    build:
      context: .
      dockerfile: dockerfiles/llm.Dockerfile
    container_name: llm-app
    depends_on:
      - pg-llm
      - auth
    environment:
      - SERVER_PORT=8090
      - SPRING_DATASOURCE_URL=${DATASOURCE_LLM_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${RESOURCE_SERVER_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=${RESOURCE_SERVER_JWK_SET_URI}
      - CORS_FRONTEND_URL_HOST=${FRONTEND_URL_HOST}
      - SPRING_AI_VECTORSTORE_PGVECTOR_INDEX_TYPE=${INDEX_TYPE}
      - SPRING_AI_VECTORSTORE_PGVECTOR_DISTANCE_TYPE=${DISTANCE_TYPE}
      - SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA=${INITIALIZE_SCHEMA}
      - SPRING_AI_VERTEX_AI_EMBEDDING_PROJECT_ID=${VERTEX_PROJECT_ID}
      - SPRING_AI_VERTEX_AI_EMBEDDING_LOCATION=${VERTEX_LOCATION}
      - SPRING_AI_VERTEX_AI_EMBEDDING_TEXT_OPTIONS_MODEL=${VERTEX_EMBEDDING_MODEL}
      - SPRING_AI_VERTEX_AI_GEMINI_PROJECT_ID=${VERTEX_PROJECT_ID}
      - SPRING_AI_VERTEX_AI_GEMINI_LOCATION=${VERTEX_LOCATION}
      - GOOGLE_STORAGE_BUCKET=${GCP_STORAGE_BUCKET_NAME}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/credentials.json
    volumes:
      - ./secret/credentials.json:/secrets/credentials.json:ro
    ports:
      - "8090:8090"
    networks:
      - lib-network

  frontend:
    build:
      context: .
      dockerfile: dockerfiles/angular.Dockerfile
    container_name: frontend-app
    depends_on:
      - auth
      - articles
      - files
      - llm
    ports:
      - "4200:4200"
    networks:
      - lib-network

  pg-auth:
    image: postgres:16
    container_name: pg-auth
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_AUTH_DATABASE}
    ports:
      - "5439:5432"
    volumes:
      - pg-data-auth:/var/lib/postgresql/data
    networks:
      - lib-network

  pg-articles:
    image: postgres:16
    container_name: pg-articles
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_ARTICLES_DATABASE}
    ports:
      - "5438:5432"
    volumes:
      - pg-data-articles:/var/lib/postgresql/data
    networks:
      - lib-network

  pg-llm:
    image: pgvector/pgvector:pg16
    container_name: pg-llm
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_LLM_DATABASE}
      - PGDATA=/var/lib/postgresql/pgdata
    ports:
      - "5440:5432"
    volumes:
      - pg-data-llm:/var/lib/postgresql
    networks:
      - lib-network

  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lib-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    depends_on:
      - frontend
      - auth
      - articles
      - files
      - llm
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lib-network

volumes:
  pg-data-auth:
  pg-data-articles:
  pg-data-llm:
  redis-data:

networks:
  lib-network:
