services:
  pg-auth:
    image: postgres:16
    command: ["postgres", "-c", "timezone=Europe/Kyiv"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_AUTH_DATABASE}
    ports:
      - "5439:5432"
    volumes:
      - pg-data-auth:/var/lib/postgresql/data

  pg-articles:
    image: postgres:16
    command: ["postgres", "-c", "timezone=Europe/Kyiv"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_ARTICLES_DATABASE}
    ports:
      - "5438:5432"
    volumes:
      - pg-data-articles:/var/lib/postgresql/data

  pg-llm:
    image: 'pgvector/pgvector:pg16'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_LLM_DATABASE}
    ports:
      - "5440:5432"
    volumes:
      - pg-data-llm:/var/lib/postgresql

  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    command: [ "redis-server", "--requirepass", "1234" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  pg-data-articles:
  pg-data-auth:
  pg-data-llm:
  redis-data:


# auth - authorization + user managment
# articles - logic related to articles, include
# files - for uploading files, related to user avatar and images for articles
#